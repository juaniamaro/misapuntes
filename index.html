<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Apuntes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="title"></h1>
    </header>

    <nav>
        <a href="#">Lenguajes de Programación</a>
        <a href="#">Diseño Web</a>
        <a href="#">IA</a>
        <a href="#">Ciberseguridad</a>
    </nav>

    <main>
        <div class="card">
            <h2>Bienvenido</h2>
            <p>
                Aquí podrás organizar todos tus apuntes de Diseño Web,
                Inteligencia Artificial, Ciberseguridad y Lenguajes de Programación.
            </p>
        </div>
    </main>
<script>
const texto = "REPO";

let i = 0;
let borrando = false;

function efectoTypewriter() {
    const titulo = document.getElementById("title");

    if (!borrando) {
        // ESCRIBIR
        titulo.textContent = texto.substring(0, i);
        i++;

        if (i > texto.length) {
            borrando = true;
            setTimeout(efectoTypewriter, 1200); // pausa cuando termina de escribir
            return;
        }

    } else {
        // BORRAR
        titulo.textContent = texto.substring(0, i);
        i--;

        if (i < 0) {
            borrando = false;
            i = 0;
        }
    }

    setTimeout(efectoTypewriter, borrando ? 60 : 120);
}

efectoTypewriter();
</script>
</body>
</html>
