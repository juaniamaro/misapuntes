<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Apuntes</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="terminal-header">
    <h1 id="titulo"></h1>
</header>

<nav>
    <a href="#">Diseño Web</a>
    <a href="#">IA</a>
    <a href="#">Ciberseguridad</a>
    <a href="#">Lenguajes de Programación</a>
</nav>

<main>
    <div class="card">
        <h2>Bienvenido</h2>
        <p>
            Aquí podrás guardar y organizar tus apuntes de programación,
            inteligencia artificial y ciberseguridad.
        </p>
    </div>
</main>

<script>
const texto = "REPO";

let i = 0;
let borrando = false;

function efectoTerminal() {
    const titulo = document.getElementById("titulo");

    if (!borrando) {
        titulo.textContent = texto.substring(0, i);
        i++;

        if (i > texto.length) {
            borrando = true;
            setTimeout(efectoTerminal, 1500);
            return;
        }

    } else {
        titulo.textContent = texto.substring(0, i);
        i--;

        if (i < 0) {
            borrando = false;
            i = 0;
        }
    }

    setTimeout(efectoTerminal, borrando ? 50 : 90);
}

efectoTerminal();
</script>

</body>
</html>
