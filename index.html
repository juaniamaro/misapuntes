<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Apuntes</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background-color:#0d0d0d;
        color:white;
        min-height:100vh;
    }

    /* Cabecera */
    header{
        background: linear-gradient(90deg, #ff4fa3, #72f2c0);
        padding:30px;
        text-align:center;
        box-shadow:0 4px 15px rgba(0,0,0,0.4);
    }

    header h1{
        font-size:3rem;
        color:#000;
        font-weight:bold;
    }

    /* Menú */
    nav{
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:20px;
        padding:30px;
    }

    nav a{
        text-decoration:none;
        color:white;
        background:#1a1a1a;
        padding:15px 25px;
        border-radius:12px;
        border:2px solid #72f2c0;
        transition:0.3s;
        font-weight:bold;
    }

    nav a:hover{
        background:#ff4fa3;
        border-color:#ff4fa3;
        transform:translateY(-3px);
    }

    /* Contenido principal */
    main{
        display:flex;
        justify-content:center;
        align-items:center;
        padding:50px;
    }

    .card{
        background:#1a1a1a;
        border:2px solid #72f2c0;
        border-radius:20px;
        padding:40px;
        max-width:800px;
        width:100%;
        text-align:center;
    }

    .card h2{
        color:#ff4fa3;
        margin-bottom:15px;
    }

    .card p{
        color:#ddd;
        line-height:1.6;
    }
</style>
</head>

<body>

<header>
    <h1>📚 Mis Apuntes</h1>
</header>

<nav>
    <a href="#">Diseño Web</a>
    <a href="#">IA</a>
    <a href="#">Ciberseguridad</a>
    <a href="#">Lenguajes de Programación</a>
</nav>

<main>
    <div class="card">
        <h2>Bienvenido</h2>
        <p>
            Aquí podrás organizar todos tus apuntes de Diseño Web,
            Inteligencia Artificial, Ciberseguridad y Lenguajes de Programación.
        </p>
    </div>
</main>

</body>
</html>
