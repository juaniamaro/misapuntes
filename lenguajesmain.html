<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lenguajes de Programación</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 HEADER ORIGINAL -->
<header class="terminal-header">
    <h1 id="titulo"></h1>
</header>

<!-- 🔥 MENÚ ORIGINAL -->
<nav>
    <a href="index.html">Inicio</a>
    <a href="#">Diseño Web</a>
    <a href="#">IA</a>
    <a href="#">Ciberseguridad</a>
    <a href="lenguajesmain.html">Lenguajes de Programación</a>
</nav>
<div class="search-wrapper">

    <div class="search-box">
        <span class="icon">🔍</span>

        <input type="text" id="buscador" placeholder="Buscar lenguaje...">
    </div>

</div>
<!-- 🧠 CONTENIDO PRINCIPAL -->
<main class="lenguajes-grid">

    <a href="#" class="lang-card">
        <div class="icon">🐍</div>
        <h3>Python</h3>
    </a>

    <a href="#" class="lang-card">
        <div class="icon">🌐</div>
        <h3>JavaScript</h3>
    </a>

    <a href="#" class="lang-card">
        <div class="icon">☕</div>
        <h3>Java</h3>
    </a>

    <a href="#" class="lang-card">
        <div class="icon">⚙️</div>
        <h3>C / C++</h3>
    </a>

    <a href="#" class="lang-card">
        <div class="icon">🧠</div>
        <h3>Go</h3>
    </a>

    <a href="#" class="lang-card">
        <div class="icon">💠</div>
        <h3>C#</h3>
    </a>

</main>
<script>
const buscador = document.getElementById("buscador");
const cards = document.querySelectorAll(".lang-card");

buscador.addEventListener("input", function () {
    const valor = this.value.toLowerCase();

    cards.forEach(card => {
        const texto = card.querySelector("h3").textContent.toLowerCase();

        if (texto.includes(valor)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
});
</script>
    <script>
const texto = "Lenguajes de Programación";

let i = 0;
let borrando = false;

function efectoTerminal() {
    const titulo = document.getElementById("titulo");

    if (!borrando) {
        titulo.textContent = texto.substring(0, i);
        i++;

        if (i > texto.length) {
            borrando = true;
            setTimeout(efectoTerminal, 1500);
            return;
        }

    } else {
        titulo.textContent = texto.substring(0, i);
        i--;

        if (i < 0) {
            borrando = false;
            i = 0;
        }
    }

    setTimeout(efectoTerminal, borrando ? 50 : 90);
}

efectoTerminal();
</script>
</body>
</html>
